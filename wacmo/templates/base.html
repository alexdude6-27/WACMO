<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#244b35">
    <title>{% block title %}Home{% endblock %} | WACMO</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/site.css') }}">
</head>
<body>
    <a class="skip-link" href="#main-content">
        Skip to content
    </a>

    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="{{ url_for('home') }}">
                <span class="brand-name">WACMO</span>
                <span class="brand-description">
                    Washington Association of
                    Competitive Mounted Orienteering
                </span>
            </a>

            <nav class="site-nav" aria-label="Main navigation">
                {% for label, endpoint in navigation %}
                <a href="{{ url_for(endpoint) }}"
                   {% if request.endpoint == endpoint %}aria-current="page"{% endif %}>
                    {{ label }}
                </a>
                {% endfor %}
            </nav>
        </div>
    </header>

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <strong>WACMO</strong>
            <span>
                Riding adventures and shared memories.
            </span>
        </div>
    </footer>
</body>
</html>
